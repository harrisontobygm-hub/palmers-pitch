<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmer's — Presentation by Final Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,opsz,wght@0..100,9..144,300..700&display=swap">
<style>
  :root{
    --cocoa:#2A1A11;
    --butter:#F5EDE0;
    --gold:#E0A24A;
    --shade:#1A0F09;
    --oil:#C88B4A;
  }

  *,*::before,*::after{box-sizing:border-box;}

  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    background:var(--cocoa);
    color:var(--butter);
    font-family:'Fraunces',Georgia,'Times New Roman',serif;
    font-size:17px;
    line-height:1.7;
    font-weight:400;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  p{ max-width:60ch; }

  img,video{ display:block; max-width:100%; }

  /* Display register — Fraunces at low softness, tight tracking. */
  .display{
    font-size:5vw;
    line-height:1.2;
    letter-spacing:-0.015em;
    font-weight:400;
    font-variation-settings:'SOFT' 0,'opsz' 144,'WONK' 0;
    margin:0;
  }

  a:focus-visible,button:focus-visible,video:focus-visible{
    outline:2px solid var(--butter);
    outline-offset:4px;
  }

  /* ---------- 1. Title card ---------- */
  .title-card{
    background:var(--cocoa);
    padding:22px 6vw;
    text-align:center;
  }
  .title-line{
    margin:0 auto;
    max-width:none;
    color:var(--butter);
    font-size:clamp(19px,1.5vw,30px);
    line-height:1.6;
    letter-spacing:0.01em;
    font-weight:300;
    font-variation-settings:'SOFT' 20,'opsz' 24,'WONK' 0;
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 1.4s cubic-bezier(.22,.61,.36,1) forwards;
  }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }

  /* ---------- 2. Tahiti film — whole frame, never cropped ---------- */
  .film{
    background:var(--shade);
    line-height:0;
  }
  .film video{
    display:block;
    width:100%;
    max-width:1920px;     /* its own resolution — never upscaled past it */
    height:auto;
    aspect-ratio:16 / 9;  /* the frame it was shot for */
    object-fit:contain;
    margin:0 auto;
    background:var(--shade);
  }

  /* ---------- Section headings ---------- */
  .section-head{
    margin:0 0 3.5vh;
    text-align:center;
    color:var(--butter);
    font-size:max(20px,2vw);
    line-height:1.3;
    letter-spacing:-0.015em;
    font-weight:400;
    font-variation-settings:'SOFT' 0,'opsz' 144,'WONK' 0;
  }

  /* ---------- 3. Vertical diptych ---------- */
  .diptych{
    background:var(--shade);
    padding:6vh 4vw;
  }
  .reels{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4vw;
  }
  .reels video{
    height:82vh;
    width:auto;
    max-width:44vw;
    object-fit:contain;
    background:var(--shade);
  }

  /* ---------- 4. Stills — three ordered rows of four ---------- */
  .stills-section{
    padding:14vh 6vw;
    background:var(--cocoa);
  }
  .stills{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:3vw;
  }
  .stills img{
    width:100%;
    height:auto;          /* let aspect-ratio drive the box, not the HTML attribute */
    aspect-ratio:3 / 4;
    object-fit:cover;
    border:0;
    border-radius:0;
    box-shadow:none;
  }

  /* ---------- 5. Close ---------- */
  .close{
    padding:10vh 6vw;
    text-align:center;
    background:var(--cocoa);
  }
  .close p{
    margin:0 auto;
    max-width:20ch;
    font-size:max(21px,2.2vw);
    color:var(--butter);
  }
  .stop{ color:var(--gold); }

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    .diptych{ padding:6vh 5vw; }
    .reels{
      flex-direction:column;
      gap:4vh;
    }
    .reels video{
      height:70vh;
      max-width:90vw;
    }
    .stills-section{ padding:10vh 6vw; }
    .stills{
      grid-template-columns:repeat(2,1fr);
      gap:4vw;
    }
  }

  @media (max-width:480px){
    .stills-section{ padding:8vh 7vw; }
    .stills{
      grid-template-columns:1fr;
      gap:8vh;
    }
    .close{ padding:9vh 7vw; }
  }

  @media (prefers-reduced-motion:reduce){
    .title-line{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

  <!-- 1 — Title card -->
  <section class="title-card" id="s-title">
    <p class="title-line">Presentation for Palmer&rsquo;s, prepared by Final Cut.</p>
  </section>

  <!-- 2 — Tahiti Is a Feeling -->
  <section class="film" id="s-film">
    <video id="tahiti"
           src="assets/tahiti.mp4"
           poster="assets/poster-tahiti.webp"
           width="1920" height="1080"
           autoplay loop playsinline controls preload="auto"
           aria-label="Tahiti Is a Feeling — brand film"></video>
  </section>

  <!-- 3 — Vertical diptych -->
  <section class="diptych" id="s-diptych">
    <h2 class="section-head">Reel examples:</h2>
    <div class="reels">
    <video class="reel"
           src="assets/body-oil-short.mp4"
           poster="assets/poster-body-oil-short.webp"
           playsinline controls preload="auto"
           aria-label="Body oil short film, vertical"></video>
    <video class="reel"
           src="assets/body-oil-hero.mp4"
           poster="assets/poster-body-oil-hero.webp"
           playsinline controls preload="auto"
           aria-label="Body oil hero film, vertical"></video>
    </div>
  </section>

  <!-- 4 — Stills: bottles, tubs, bottles -->
  <section class="stills-section" id="s-stills">
    <h2 class="section-head">Product photography examples:</h2>
    <div class="stills">
    <img src="assets/bottle-01.webp" width="1344" height="1800" loading="lazy" alt="Palmer's Shimmer Radiance Body Oil standing on dark marble, lit by a warm rim light.">
    <img src="assets/bottle-02.webp" width="1344" height="1800" loading="lazy" alt="Palmer's Skin Therapy Oil bottle photographed against a clean pale studio background.">
    <img src="assets/bottle-03.webp" width="1344" height="1800" loading="lazy" alt="Palmer's Cocoa Butter Formula Body Oil upright on veined white marble.">
    <img src="assets/bottle-04.webp" width="1344" height="1800" loading="lazy" alt="Palmer's Shimmer Radiance Body Oil on black marble above a pool of amber light.">

    <img src="assets/tub-01.webp" width="1344" height="1800" loading="lazy" alt="Open tub of Palmer's Cocoa Butter Formula beside its lid, with cocoa butter and oil on sand.">
    <img src="assets/tub-02.webp" width="1344" height="1800" loading="lazy" alt="Tub of Palmer's Cocoa Butter Formula on a black reflective surface, mirrored below.">
    <img src="assets/tub-03.webp" width="1344" height="1800" loading="lazy" alt="Tub of Palmer's Cocoa Butter Formula among falling pink petals.">
    <img src="assets/tub-04.webp" width="1344" height="1800" loading="lazy" alt="Tub of Palmer's Cocoa Butter Formula nested in pink rose petals.">

    <img src="assets/bottle-05.webp" width="1344" height="1800" loading="lazy" alt="Palmer's Cocoa Butter Formula Body Oil on a wet reflective surface beneath a blue horizon.">
    <img src="assets/bottle-06.webp" width="1344" height="1800" loading="lazy" alt="Palmer's Skin Therapy Oil lying in a shallow pool of amber oil.">
    <img src="assets/bottle-07.webp" width="1344" height="1800" loading="lazy" alt="Palmer's Skin Therapy Oil resting on a molten amber ground.">
    <img src="assets/bottle-08.webp" width="1005" height="1800" loading="lazy" alt="Palmer's Cocoa Butter Formula Body Oil seen from above among split cacao pods and cocoa beans.">
    </div>
  </section>

  <!-- 5 — Close -->
  <section class="close" id="s-close">
    <p class="display">Made entirely with AI<span class="stop">.</span></p>
  </section>

<script>
  (function(){
    /* ---- Lead film: sound on from the start wherever the browser permits it ---- */
    var film = document.getElementById('tahiti');

    /* Distinguish the viewer's audio choices from our own, without racing:
       compare each volumechange against the last value we set ourselves. */
    var lastSetByUs = null;
    var viewerSetAudio = false;
    film.addEventListener('volumechange', function(){
      if(film.muted !== lastSetByUs){ viewerSetAudio = true; }
    });
    function setMuted(m){ lastSetByUs = m; film.muted = m; }

    setMuted(false);
    var attempt = film.play();

    if(attempt && attempt.catch){
      attempt.catch(function(){
        /* Sound-on autoplay is blocked until the viewer interacts.
           Start silent, then bring the sound up the moment they do. */
        setMuted(true);
        film.play();

        /* Only gestures that grant user activation — a wheel event does not,
           and unmuting without it makes the browser pause the film. */
        var events = ['pointerdown','mousedown','click','keydown','touchstart'];
        var unmute = function(){
          events.forEach(function(e){ window.removeEventListener(e, unmute, true); });
          if(viewerSetAudio){ return; }        /* they chose silence — leave it */
          setMuted(false);
          if(film.paused){
            var p = film.play();
            if(p && p.catch){ p.catch(function(){}); }
          }
        };
        events.forEach(function(e){ window.addEventListener(e, unmute, true); });
      });
    }

    /* ---- Reels: one silent pass when scrolled to, then they belong to the viewer ---- */
    var reels = document.querySelectorAll('.reel');
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          var v = entry.target;
          if(entry.isIntersecting && !v.dataset.autoplayed){
            v.dataset.autoplayed = '1';
            v.muted = true;
            var p = v.play();
            if(p && p.catch){ p.catch(function(){}); }
          }
        });
      }, {threshold:0.4});
      Array.prototype.forEach.call(reels, function(v){ io.observe(v); });
    } else {
      Array.prototype.forEach.call(reels, function(v){ v.muted = true; v.play(); });
    }
  })();
</script>

</body>
</html>
